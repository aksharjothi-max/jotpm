<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="funnelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="loopGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.03">
    <line x1="60" y1="0" x2="60" y2="630" stroke="white"/>
    <line x1="120" y1="0" x2="120" y2="630" stroke="white"/>
    <line x1="180" y1="0" x2="180" y2="630" stroke="white"/>
    <line x1="240" y1="0" x2="240" y2="630" stroke="white"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="white"/>
    <line x1="360" y1="0" x2="360" y2="630" stroke="white"/>
    <line x1="420" y1="0" x2="420" y2="630" stroke="white"/>
    <line x1="480" y1="0" x2="480" y2="630" stroke="white"/>
    <line x1="540" y1="0" x2="540" y2="630" stroke="white"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white"/>
    <line x1="660" y1="0" x2="660" y2="630" stroke="white"/>
    <line x1="720" y1="0" x2="720" y2="630" stroke="white"/>
    <line x1="780" y1="0" x2="780" y2="630" stroke="white"/>
    <line x1="840" y1="0" x2="840" y2="630" stroke="white"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="white"/>
    <line x1="960" y1="0" x2="960" y2="630" stroke="white"/>
    <line x1="1020" y1="0" x2="1020" y2="630" stroke="white"/>
    <line x1="1080" y1="0" x2="1080" y2="630" stroke="white"/>
    <line x1="1140" y1="0" x2="1140" y2="630" stroke="white"/>
    <line x1="0" y1="60" x2="1200" y2="60" stroke="white"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="white"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="white"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="white"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="white"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="white"/>
    <line x1="0" y1="480" x2="1200" y2="480" stroke="white"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="white"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="white"/>
  </g>

  <!-- Left side: Funnel (leaking) -->
  <g transform="translate(150, 120)">
    <!-- Funnel shape -->
    <path d="M0,0 L200,0 L160,120 L40,120 Z" fill="url(#funnelGrad)" stroke="#52525b" stroke-width="1"/>
    <path d="M40,120 L160,120 L130,240 L70,240 Z" fill="url(#funnelGrad)" stroke="#52525b" stroke-width="1" opacity="0.8"/>
    <path d="M70,240 L130,240 L110,360 L90,360 Z" fill="url(#funnelGrad)" stroke="#52525b" stroke-width="1" opacity="0.6"/>
    
    <!-- Leak drops -->
    <circle cx="25" cy="80" r="4" fill="#ef4444" opacity="0.8"/>
    <circle cx="180" cy="100" r="3" fill="#ef4444" opacity="0.6"/>
    <circle cx="55" cy="200" r="4" fill="#ef4444" opacity="0.7"/>
    <circle cx="150" cy="220" r="3" fill="#ef4444" opacity="0.5"/>
    <circle cx="80" cy="310" r="4" fill="#ef4444" opacity="0.6"/>
    <circle cx="125" cy="340" r="3" fill="#ef4444" opacity="0.4"/>
    
    <!-- Falling drops -->
    <ellipse cx="15" cy="140" rx="3" ry="5" fill="#ef4444" opacity="0.5"/>
    <ellipse cx="190" cy="160" rx="2" ry="4" fill="#ef4444" opacity="0.4"/>
    <ellipse cx="45" cy="270" rx="3" ry="5" fill="#ef4444" opacity="0.4"/>
    
    <!-- Leak label -->
    <text x="100" y="395" text-anchor="middle" fill="#ef4444" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" opacity="0.9">LEAKS</text>
  </g>

  <!-- VS divider -->
  <line x1="600" y1="180" x2="600" y2="450" stroke="#27272a" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="600" cy="315" r="20" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="600" y="320" text-anchor="middle" fill="#71717a" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">VS</text>

  <!-- Right side: Loop (compounding) -->
  <g transform="translate(680, 150)">
    <!-- Circular loop arrow -->
    <path d="M60,0 C120,0 140,60 140,120 C140,180 120,240 60,240 C0,240 -20,180 -20,120 C-20,60 0,0 60,0 Z" 
          fill="none" stroke="url(#loopGrad)" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Arrow head -->
    <polygon points="75,-8 90,8 62,8" fill="#f59e0b"/>
    
    <!-- Users in loop -->
    <circle cx="60" cy="-15" r="12" fill="#f59e0b" opacity="0.9"/>
    <circle cx="130" cy="120" r="12" fill="#f59e0b" opacity="0.8"/>
    <circle cx="60" cy="255" r="12" fill="#f59e0b" opacity="0.7"/>
    <circle cx="-10" cy="120" r="12" fill="#f59e0b" opacity="0.6"/>
    
    <!-- Multiplier sparks -->
    <text x="95" y="55" fill="#f59e0b" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold">×2</text>
    <text x="95" y="195" fill="#f59e0b" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold">×4</text>
    <text x="25" y="55" fill="#f59e0b" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold">×8</text>
    <text x="25" y="195" fill="#f59e0b" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold">×16</text>
    
    <!-- Compounding label -->
    <text x="60" y="290" text-anchor="middle" fill="#f59e0b" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" opacity="0.9">COMPOUNDS</text>
  </g>

  <!-- Title bar -->
  <g transform="translate(600, 80)">
    <text x="0" y="0" text-anchor="middle" fill="#ededed" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.02em">Growth Loops, Not Funnels</text>
  </g>

  <!-- Brand -->
  <g transform="translate(600, 580)">
    <text x="0" y="0" text-anchor="middle" fill="#52525b" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">JOT<tspan fill="#f59e0b">PM</tspan></text>
  </g>
</svg>
