<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
  <style>
    .preview-banner {
      background: #F5F5F7;
      border: 1px solid #E8E8ED;
      border-radius: 0.75rem;
      padding: 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .preview-banner-text {
      font-size: 0.9375rem;
      color: #424245;
    }
    .preview-banner-text strong {
      color: #1D1D1F;
    }
    .preview-actions {
      display: flex;
      gap: 0.75rem;
    }
    .btn-preview-publish {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.625rem 1.5rem;
      background: #0071E3;
      color: #FFFFFF;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-preview-publish:hover {
      background: #0058B0;
    }
    .btn-preview-edit {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.625rem 1.5rem;
      background: transparent;
      color: #0071E3;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: 9999px;
      border: 1px solid #0071E3;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-preview-edit:hover {
      background: #E8F4FD;
    }
    .btn-preview-publish:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .success-message {
      display: none;
      background: #D1FAE5;
      border: 1px solid #10B981;
      color: #065F46;
      padding: 1rem 1.5rem;
      border-radius: 0.75rem;
      margin-bottom: 1.5rem;
      font-size: 0.9375rem;
      font-weight: 500;
    }
    .preview-frame {
      border: 2px solid #E8E8ED;
      border-radius: 1rem;
      overflow: hidden;
      background: #FFFFFF;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="container nav-inner">
      <a href="/" class="nav-logo"><span class="jot">Jot</span><span class="pm">PM</span></a>
      <div class="nav-links">
        <a href="/blog.html" class="nav-link">Blog</a>
        <a href="/about.html" class="nav-link">About</a>
        <a href="mailto:aksharjothi@gmail.com" class="nav-cta">Contact</a>
      </div>
    </div>
  </nav>

  <!-- Preview Banner -->
  <div class="container" style="padding-top: 2rem;">
    <div class="success-message" id="success-message">
      ✅ Article published successfully! It's now live on the blog.
    </div>
    <div class="preview-banner" id="preview-banner">
      <div class="preview-banner-text">
        <strong>Preview Mode</strong> — This is how your article will look when published.
      </div>
      <div class="preview-actions">
        <button class="btn-preview-edit" onclick="window.history.back()">← Back</button>
        <button class="btn-preview-publish" id="publish-btn" onclick="publishArticle()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          Publish Article
        </button>
      </div>
    </div>
  </div>

  <!-- Article Preview -->
  <div class="preview-frame">
    <div id="article-container">
      <!-- Article content loads here -->
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-logo"><span class="jot">Jot</span><span class="pm">PM</span></div>
        <div class="footer-links">
          <a href="/" class="footer-link">Home</a>
          <a href="/blog.html" class="footer-link">Blog</a>
          <a href="/about.html" class="footer-link">About</a>
        </div>
        <div class="footer-social">
          <a href="https://github.com/aksharjothi-max" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          </a>
          <a href="https://linkedin.com/in/aksharjothi" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
          </a>
        </div>
        <div class="footer-copy">&copy; 2026 JotPM by Akshar Jothi. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <script>
    // Get article ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const articleId = urlParams.get('article');
    
    // Load article content
    async function loadArticle() {
      if (!articleId) {
        document.getElementById('article-container').innerHTML = '<div class="container"><p>No article specified.</p></div>';
        return;
      }
      
      try {
        const response = await fetch(`/articles/${articleId}.html`);
        if (!response.ok) throw new Error('Article not found');
        
        const html = await response.text();
        // Extract the article content (between article tags)
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const articleHero = doc.querySelector('.article-hero');
        const articleContent = doc.querySelector('.article-content');
        
        let content = '';
        if (articleHero) content += articleHero.outerHTML;
        if (articleContent) content += articleContent.outerHTML;
        
        if (content) {
          document.getElementById('article-container').innerHTML = content;
        } else {
          // Fallback: show full body content
          document.getElementById('article-container').innerHTML = doc.body.innerHTML;
        }
      } catch (error) {
        document.getElementById('article-container').innerHTML = '<div class="container"><p>Article not found. It may not exist yet.</p></div>';
      }
    }
    
    // Publish article
    function publishArticle() {
      const btn = document.getElementById('publish-btn');
      btn.disabled = true;
      btn.innerHTML = 'Publishing...';
      
      // Show success message
      setTimeout(() => {
        document.getElementById('preview-banner').style.display = 'none';
        document.getElementById('success-message').style.display = 'block';
        
        // Redirect to the article after 2 seconds
        setTimeout(() => {
          window.location.href = `/articles/${articleId}.html`;
        }, 2000);
      }, 1000);
    }
    
    // Load article on page load
    loadArticle();
  </script>
</body>
</html>
